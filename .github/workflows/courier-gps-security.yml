name: Courier GPS security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: courier-gps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gps-isolation:
    name: PostgreSQL 17 and PostgREST GPS isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rpmdelivery_gps_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rpmdelivery_gps_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RPMDELIVERY_DISPOSABLE_POSTGRES: "1"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGDATABASE: rpmdelivery_gps_test
      PGUSER: postgres
      GPS_TEST_HTTP_URL: http://127.0.0.1:3319
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Synthetic PostgreSQL before/after
        run: |
          mkdir -p test-results
          bash tests/sql/run-courier-gps.sh 2>&1 | tee test-results/courier-gps-postgres.txt
      - name: Start isolated local PostgREST
        run: |
          mkdir -p playwright/.cache/postgrest
          curl --fail --location --retry 3 \
            https://github.com/PostgREST/postgrest/releases/download/v16.1/postgrest-v16.1-linux-static-x86-64.tar.xz \
            --output playwright/.cache/postgrest/release.tar.xz
          echo 'b986c926cf16a1c5d97954c57d3a6edd894a5da225c3f3fc0c25dc4105009dd7  playwright/.cache/postgrest/release.tar.xz' | sha256sum --check
          tar -xJf playwright/.cache/postgrest/release.tar.xz -C playwright/.cache/postgrest
          chmod +x playwright/.cache/postgrest/postgrest
          playwright/.cache/postgrest/postgrest --version
          nohup env \
            PGRST_DB_URI=postgresql://authenticator@127.0.0.1:5432/rpmdelivery_gps_test \
            PGRST_DB_SCHEMAS=public PGRST_DB_ANON_ROLE=anon \
            PGRST_SERVER_HOST=127.0.0.1 PGRST_SERVER_PORT=3319 \
            PGRST_JWT_SECRET=rpmdelivery-gps-synthetic-jwt-secret-for-local-tests-only \
            playwright/.cache/postgrest/postgrest >test-results/courier-gps-server.txt 2>&1 &
      - name: HTTP column permissions and route RLS
        run: |
          for status in ACTIVE PENDING REJECTED SUSPENDED; do
            psql -X -v ON_ERROR_STOP=1 -c "update public.restaurant_couriers set status='$status' where id=gps_test.id(302);"
            GPS_TEST_RELATIONSHIP="$status" node tests/sql/courier-gps/postgrest.mjs 2>&1 | tee -a test-results/courier-gps-http.txt
          done
      - name: Synthetic security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: courier-gps-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/courier-gps-*.txt
          if-no-files-found: ignore
          retention-days: 7
